services:
  relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semaphore-relayer
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - RPC_URL=${RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - RECORD_ENDPOINT=${RECORD_ENDPOINT}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://localhost:${PORT}/health').then(r => r.ok ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - semaphore-network

networks:
  semaphore-network:
    driver: bridge
